<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Customer Churn Prediction
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>


<body>


<nav>

    <div class="logo">
        ChurnAI
    </div>

    <div class="nav-links">

        <a href="/">
            Prediction
        </a>

        <a href="/analysis">
            Analysis
        </a>

    </div>

</nav>


<section class="hero">

    <div class="hero-content">

        <h1>
            Customer Churn
            <span>Prediction</span>
        </h1>

        <p>
            Predict customer churn using
            Machine Learning and analyze
            customer behavior.
        </p>

    </div>

</section>


<div class="container">


    <div class="card">


        <h2>
            Customer Information
        </h2>

        <p class="subtitle">
            Enter customer details to predict
            the probability of churn.
        </p>


        <form
            action="/predict"
            method="POST"
        >


            <div class="form-grid">


                <!-- Gender -->

                <div class="form-group">

                    <label>
                        Gender
                    </label>

                    <select name="gender">

                        <option value="Female">
                            Female
                        </option>

                        <option value="Male">
                            Male
                        </option>

                    </select>

                </div>


                <!-- Senior Citizen -->

                <div class="form-group">

                    <label>
                        Senior Citizen
                    </label>

                    <select
                        name="senior_citizen"
                    >

                        <option value="0">
                            No
                        </option>

                        <option value="1">
                            Yes
                        </option>

                    </select>

                </div>


                <!-- Partner -->

                <div class="form-group">

                    <label>
                        Partner
                    </label>

                    <select name="partner">

                        <option value="No">
                            No
                        </option>

                        <option value="Yes">
                            Yes
                        </option>

                    </select>

                </div>


                <!-- Dependents -->

                <div class="form-group">

                    <label>
                        Dependents
                    </label>

                    <select name="dependents">

                        <option value="No">
                            No
                        </option>

                        <option value="Yes">
                            Yes
                        </option>

                    </select>

                </div>


                <!-- Tenure -->

                <div class="form-group">

                    <label>
                        Tenure (Months)
                    </label>

                    <input
                        type="number"
                        name="tenure"
                        min="0"
                        required
                    >

                </div>


                <!-- Phone -->

                <div class="form-group">

                    <label>
                        Phone Service
                    </label>

                    <select
                        name="phone_service"
                    >

                        <option value="Yes">
                            Yes
                        </option>

                        <option value="No">
                            No
                        </option>

                    </select>

                </div>


                <!-- Internet -->

                <div class="form-group">

                    <label>
                        Internet Service
                    </label>

                    <select
                        name="internet_service"
                    >

                        <option value="DSL">
                            DSL
                        </option>

                        <option value="Fiber optic">
                            Fiber optic
                        </option>

                        <option value="No">
                            No
                        </option>

                    </select>

                </div>


                <!-- Contract -->

                <div class="form-group">

                    <label>
                        Contract
                    </label>

                    <select name="contract">

                        <option value="Month-to-month">
                            Month-to-month
                        </option>

                        <option value="One year">
                            One year
                        </option>

                        <option value="Two year">
                            Two year
                        </option>

                    </select>

                </div>


                <!-- Payment -->

                <div class="form-group">

                    <label>
                        Payment Method
                    </label>

                    <select
                        name="payment_method"
                    >

                        <option value="Electronic check">
                            Electronic check
                        </option>

                        <option value="Mailed check">
                            Mailed check
                        </option>

                        <option value="Bank transfer">
                            Bank transfer
                        </option>

                        <option value="Credit card">
                            Credit card
                        </option>

                    </select>

                </div>


                <!-- Monthly -->

                <div class="form-group">

                    <label>
                        Monthly Charges
                    </label>

                    <input
                        type="number"
                        step="0.01"
                        name="monthly_charges"
                        required
                    >

                </div>


                <!-- Total -->

                <div class="form-group">

                    <label>
                        Total Charges
                    </label>

                    <input
                        type="number"
                        step="0.01"
                        name="total_charges"
                        required
                    >

                </div>


            </div>


            <button
                type="submit"
                class="predict-btn"
            >

                Predict Customer Churn

            </button>


        </form>


    </div>


</div>


<script
    src="{{ url_for('static', filename='js/script.js') }}"
></script>


</body>

</html>
